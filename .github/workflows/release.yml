name: Release image

# 仅在合并到 main 后构建「正式候选」镜像，未合并分支不产出正式候选。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push candidate image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 内置凭据引用，不含任何明文值
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by commit SHA
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

      - name: Resolve digest-pinned reference
        id: meta
        run: |
          REF="ghcr.io/${GITHUB_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${GITHUB_SHA}" "${{ steps.build.outputs.digest }}" "${REF}" > image-digest.txt
          echo "### Candidate image" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest-pinned ref: ${REF}" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist digest for downstream environments
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
